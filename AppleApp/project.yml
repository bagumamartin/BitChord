# xcodegen spec — app target + WidgetKit extension target, shared App Group
# entitlement (spec §0, §9). Generate with: xcodegen generate
# Deployment targets sit at the UI spec's floor (bitchord-apple-ui-spec.md §9):
# iOS 18 / macOS 15 unlock Tab, TabSection, .tabViewStyle(.sidebarAdaptable),
# Tab(role: .search) and MeshGradient. iOS 26 / macOS 26-only chrome
# (.tabViewBottomAccessory, Liquid Glass) is availability-gated at call sites.
name: BitChord
attributes:
  LastUpgradeCheck: "1520"
options:
  createIntermediateGroups: true
  developmentLanguage: en
  # The locales the String Catalog ships. XcodeGen writes these into the
  # project's knownRegions so the localized .lproj folders are packaged.
  knownRegions: [en, de, es, fr, he, hi, id, it, ja, pl, pt-BR, ru, th, tr, vi, zh-Hans, zh-Hant, zh-HK]
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "15"
    BITCHORD_BUILD_REVISION: "unknown"
    # Typed asset symbols (Image(.bchHome)) — Xcode 15+ asset codegen.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    # String Catalog localization (upstream ships 19 locales; translations
    # carried over from its strings.xml where the English matches exactly).
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Each developer selects their own Team in Xcode's Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    # The spec (§0) ports arm64 targets only: iosArm64, iosSimulatorArm64,
    # macosArm64. Generic iOS Simulator destinations otherwise attempt a
    # universal arm64+x86_64 build, which cannot link against the arm64-only
    # BitChordShared / NativeCoreFFI slices.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  BitChord:
    type: application
    supportedDestinations: [iOS, macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bitchord.BitChord
        # The Mac executable lives in Contents/MacOS while embedded frameworks
        # live in Contents/Frameworks; the iOS default runpath omits this parent.
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: "$(inherited) @executable_path/../Frameworks"
        # Resolve Music Understanding on OS 27+; leave Automix on Rust MIR below that.
        OTHER_LDFLAGS: "$(inherited) -weak_framework MusicUnderstanding"
    sources:
      - path: Sources
        excludes:
          - "Widget/**"
      - path: Assets.xcassets
      # Icon Composer app icon (Liquid Glass, with dark/tinted/clear modes on
      # OS 26+). Same name as the asset-catalog AppIcon, which older systems use.
      - path: AppIcon.icon
        type: file
        buildPhase: resources
      # UniFFI-generated NativeCore.swift lands here via scripts/build-native-core.sh.
      - path: Generated
        optional: true
      - path: Resources/Localization
        buildPhase: resources
      - path: Resources/AudioLicenses
        type: folder
        buildPhase: resources
      - path: Resources/YouTubeSolver
        type: folder
        buildPhase: resources
    dependencies:
      - target: BitChordWidget
        embed: true
      - framework: Frameworks/BitChordShared.xcframework
        embed: true
      - framework: Frameworks/NativeCoreFFI.xcframework
        embed: true
      - sdk: WebKit.framework
      - sdk: JavaScriptCore.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: MusicUnderstanding.framework
        weak: true
      - sdk: Speech.framework
      - package: Sparkle
        product: Sparkle
        destinationFilters: [macOS]
    info:
      path: BitChord-Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BitChordRevision: "$(BITCHORD_BUILD_REVISION)"
        LSApplicationCategoryType: public.app-category.music
        SUFeedURL: https://raw.githubusercontent.com/bagumamartin/BitChord/main/appcast.xml
        SUPublicEDKey: ZoHTuKtTzesqdu6L5WyVZRkdP3v9gHJExOoM9nBEvjU=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        CFBundleURLTypes:
          - CFBundleURLName: app.bitchord.BitChord
            CFBundleURLSchemes: [bitchord]
        # Handoff of playback: the activity type the payload is carried in. The
        # system only launches this app for an activity it has been told about,
        # so the type is declared here as well as written in
        # `PlaybackHandoffPayload.activityType`.
        NSUserActivityTypes:
          - app.bitchord.playback
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        NSMotionUsageDescription: BitChord uses headphone motion to keep its spatial effect anchored when you turn your head.
        NSPhotoLibraryAddUsageDescription: BitChord saves the lyric share cards you choose to add to Photos.
        NSSpeechRecognitionUsageDescription: BitChord uses on-device speech recognition to align fetched lyrics with the playing audio. Audio is not sent to a server for alignment.
    entitlements:
      path: BitChord.entitlements
      properties:
        # Dev-build note: sandbox disabled so the NSOpenPanel runs in-process
        # (remote-hosted sandboxed panels cannot be driven by automated UI
        # tests) and the folder scan reads without a security grant. The
        # security-scoped bookmark path in LocalLibrary works with or without
        # it; flip back to true for distribution builds.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
          - group.app.bitchord.BitChord
        # iCloud key-value store: syncs the per-song lyrics provider choice (O1).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
  BitChordWidget:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bitchord.BitChord.widget
    sources:
      - Sources/Widget
    info:
      path: BitChordWidget-Info.plist
      properties:
        CFBundleDisplayName: BitChord Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BitChordRevision: "$(BITCHORD_BUILD_REVISION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BitChordWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.app.bitchord.BitChord
