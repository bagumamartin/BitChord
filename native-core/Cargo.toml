[package]
name = "native-core"
version = "0.1.0"
edition = "2021"
description = "BitChord native core: analyzer + decode/mix playback engine behind one UniFFI boundary (spec sections 2 and 3)."

[lib]
name = "native_core"
crate-type = ["staticlib", "cdylib", "rlib"]

# UniFFI ships no published bindgen CLI crate; the official route is a bin in
# your own crate calling uniffi::uniffi_bindgen_main(). Version match with the
# uniffi crate is automatic. required-features keeps cross-compilation of the
# staticlib free of the CLI feature; run it via scripts/build-native-core.sh.
[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

[dependencies]
# One FFI boundary for Swift and Kotlin bindings (spec §2).
uniffi = "0.32"
log = "0.4"
env_logger = "0.11"
# Gated BS.1770/R128 measurement; separate from the MIR RMS feature.
ebur128 = "=0.1.10"

# §3.1 Decoder — Symphonia handles AAC/M4A, FLAC, MP3, ALAC, Vorbis,
# PCM/WAV and AIFF; the libopus adapter below extends it to Opus streams.
symphonia = { version = "0.6.1", default-features = false, features = [
  "flac", "mp3", "aac", "alac", "vorbis", "pcm", "wav", "ogg", "isomp4", "mkv", "aiff",
] }
# Symphonia 0.6.1 has no Opus decoder yet. This adapter uses the reference
# libopus implementation and registers only the missing codec in our decode path.
# Its bundled C library is built with CMake; adapter: MIT/Apache-2.0, libopus:
# BSD-3-Clause Opus license.
symphonia-adapter-libopus = { version = "0.3", features = ["bundled"] }

# §3.1 audio output — CoreAudio backend on Apple.
cpal = "0.18"

# §4 tagging + local-library metadata reads (milestone 9, pulled early because
# LocalMusicView needs real tags to be a working app).
lofty = "0.25"

# §3.1 StreamingReader — blocking HTTP client behind a background fetch thread.
# native-tls uses the system TLS (Secure Transport on Apple) so the TLS
# fingerprint matches what googlevideo expects — rustls gets 403'd.
ureq = { version = "2", features = ["native-tls"] }

# Mixer plumbing: control→render commands and the real-time output ring.
crossbeam-channel = "0.5"
rtrb = "0.3"

# ONNX inference for Automix (Beat This! + open-unmix). Pure-Rust runtime so
# the same staticlib links on macOS, iOS, and the iOS simulator — no extra
# onnxruntime xcframework. The app downloads both graphs at runtime from the
# project's GitHub releases; rten is the engine.
rten = "0.26"
rten-tensor = "0.26"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cmake = "0.1"
cc = "1"
sha2 = "0.10"

# build.rs builds pinned libsoxr and the Apple AAC bridge. UniFFI uses proc macros.

# Apple only: the render thread's QoS class. The mixer answers a real-time
# deadline — the device callback drains its ring on a schedule the hardware sets
# — so a mixer that can be scheduled below the app work competing with it
# underruns, and an underrun is a dropout. Nothing outside this crate needs it.
#
# `target_vendor`, not `target_os = "macos"`: iOS has the same pthread QoS API
# and needs it more, because a Darwin thread inherits its creator's class and
# the mixer is spawned from a `.utility` startup task. Gating this to macOS left
# the decoder running in the same band as the artwork fetches it should outrank.
#
# Kept last deliberately: a `[target.…]` table ends the `[dependencies]` table
# it follows, so anything written after one of these silently becomes a
# target-specific dependency instead.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

# macOS CoreAudio's public HAL API is used for the short-lived exclusive
# (hog-mode) lease required by the opt-in bit-perfect path. These types are not
# available on iOS, where AVAudioSession owns routing and the output stream is
# float32 only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
